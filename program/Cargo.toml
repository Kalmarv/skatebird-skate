[package]
name = "skatebird-export"
version = "0.1.0"
edition = "2024"
publish = false

# primase is a library this program uses, pinned by git revision in the workspace Cargo.toml (no path checkout, no fork).
[dependencies]
primase-core.workspace = true
primase-skatebird.workspace = true
primase-unity.workspace = true
primase-meshops.workspace = true
primase-image.workspace = true
primase-reskate.workspace = true
primase-gltf.workspace = true
primase-foundations.workspace = true
unity-formats.workspace = true
serde_json = "=1.0.154"

[lib]
path = "src/lib.rs"

[[bin]]
name = "skatebird-export"
path = "src/main.rs"
