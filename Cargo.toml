# The SkateBIRD conversion (program/: the recipe) and its tooling (tools/skatebird-tools: packaging, views, shots,
# sheets), one workspace so primase is built once.
[workspace]
members = ["program", "tools/skatebird-tools"]
resolver = "3"

[workspace.dependencies]
primase-core = { git = "https://github.com/Kalmarv/primase", rev = "12bfe06875fb778aecb4ce530c3c1a34c1ff3ea2" }
primase-skatebird = { git = "https://github.com/Kalmarv/primase", rev = "12bfe06875fb778aecb4ce530c3c1a34c1ff3ea2" }
primase-unity = { git = "https://github.com/Kalmarv/primase", rev = "12bfe06875fb778aecb4ce530c3c1a34c1ff3ea2" }
primase-meshops = { git = "https://github.com/Kalmarv/primase", rev = "12bfe06875fb778aecb4ce530c3c1a34c1ff3ea2" }
primase-image = { git = "https://github.com/Kalmarv/primase", rev = "12bfe06875fb778aecb4ce530c3c1a34c1ff3ea2" }
primase-reskate = { git = "https://github.com/Kalmarv/primase", rev = "12bfe06875fb778aecb4ce530c3c1a34c1ff3ea2" }
primase-gltf = { git = "https://github.com/Kalmarv/primase", rev = "12bfe06875fb778aecb4ce530c3c1a34c1ff3ea2" }
primase-foundations = { git = "https://github.com/Kalmarv/primase-foundations", rev = "05dc616e7bd14cad63c4e5218be6e8b79cee60ce", features = ["compress"] }
unity-formats = { git = "https://github.com/Kalmarv/unity-formats", rev = "6c7d3d8c7ff09c473c2427f4cb1597e31f9bfd8e" }
