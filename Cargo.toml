# The SkateBIRD conversion (program/: the recipe) and its tooling (tools/skatebird-tools: packaging, views, shots,
# sheets), one workspace so primase is built once.
[workspace]
members = ["program", "tools/skatebird-tools"]
resolver = "3"

[workspace.dependencies]
primase-core = { git = "https://github.com/Kalmarv/primase", rev = "35e084541fcd4f5985335e6271583c695080492f" }
primase-skatebird = { git = "https://github.com/Kalmarv/primase", rev = "35e084541fcd4f5985335e6271583c695080492f" }
primase-unity = { git = "https://github.com/Kalmarv/primase", rev = "35e084541fcd4f5985335e6271583c695080492f" }
primase-meshops = { git = "https://github.com/Kalmarv/primase", rev = "35e084541fcd4f5985335e6271583c695080492f" }
primase-image = { git = "https://github.com/Kalmarv/primase", rev = "35e084541fcd4f5985335e6271583c695080492f" }
primase-reskate = { git = "https://github.com/Kalmarv/primase", rev = "35e084541fcd4f5985335e6271583c695080492f" }
primase-gltf = { git = "https://github.com/Kalmarv/primase", rev = "35e084541fcd4f5985335e6271583c695080492f" }
primase-foundations = { git = "https://github.com/Kalmarv/primase-foundations", rev = "dc4369b73343f3e0d81adc47f2e504027efc1d5a", features = ["compress"] }
unity-formats = { git = "https://github.com/Kalmarv/unity-formats", rev = "fa95acb5c6cc2f0d377b082fe353a74bcf45e9b1" }
