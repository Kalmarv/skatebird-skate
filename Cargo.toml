# The SkateBIRD conversion (program/: the recipe) and its tooling (tools/skatebird-tools: packaging, views, shots,
# sheets), one workspace so primase is built once.
[workspace]
members = ["program", "tools/skatebird-tools"]
resolver = "3"

[workspace.dependencies]
primase-core = { git = "https://github.com/Kalmarv/primase", rev = "6c1f66ec1a6b42efded94a97c382a3df5fe748ce" }
primase-skatebird = { git = "https://github.com/Kalmarv/primase", rev = "6c1f66ec1a6b42efded94a97c382a3df5fe748ce" }
primase-unity = { git = "https://github.com/Kalmarv/primase", rev = "6c1f66ec1a6b42efded94a97c382a3df5fe748ce" }
primase-meshops = { git = "https://github.com/Kalmarv/primase", rev = "6c1f66ec1a6b42efded94a97c382a3df5fe748ce" }
primase-image = { git = "https://github.com/Kalmarv/primase", rev = "6c1f66ec1a6b42efded94a97c382a3df5fe748ce" }
primase-reskate = { git = "https://github.com/Kalmarv/primase", rev = "6c1f66ec1a6b42efded94a97c382a3df5fe748ce" }
primase-gltf = { git = "https://github.com/Kalmarv/primase", rev = "6c1f66ec1a6b42efded94a97c382a3df5fe748ce" }
primase-foundations = { git = "https://github.com/Kalmarv/primase-foundations", rev = "f9cf4ece1de77fce9d703c63347dd70b728b7c0e", features = ["compress"] }
unity-formats = { git = "https://github.com/Kalmarv/unity-formats", rev = "aa1c81aa3545ddcd22e611cdea6dfaac97010d34" }
