# The SkateBIRD conversion (program/: the recipe) and its tooling (tools/skatebird-tools: packaging, views, shots,
# sheets), one workspace so primase is built once.
[workspace]
members = ["program", "tools/skatebird-tools"]
resolver = "3"

[workspace.dependencies]
primase-core = { git = "https://github.com/Kalmarv/primase", rev = "deed36b7cf3300dd32925fa09f2de08de4e7c21c" }
primase-skatebird = { git = "https://github.com/Kalmarv/primase", rev = "deed36b7cf3300dd32925fa09f2de08de4e7c21c" }
primase-unity = { git = "https://github.com/Kalmarv/primase", rev = "deed36b7cf3300dd32925fa09f2de08de4e7c21c" }
primase-meshops = { git = "https://github.com/Kalmarv/primase", rev = "deed36b7cf3300dd32925fa09f2de08de4e7c21c" }
primase-image = { git = "https://github.com/Kalmarv/primase", rev = "deed36b7cf3300dd32925fa09f2de08de4e7c21c" }
primase-reskate = { git = "https://github.com/Kalmarv/primase", rev = "deed36b7cf3300dd32925fa09f2de08de4e7c21c" }
primase-gltf = { git = "https://github.com/Kalmarv/primase", rev = "deed36b7cf3300dd32925fa09f2de08de4e7c21c" }
primase-foundations = { git = "https://github.com/Kalmarv/primase-foundations", rev = "b3a3d4b3a892b8342fda081ab4449bb57052a2f8", features = ["compress"] }
unity-formats = { git = "https://github.com/Kalmarv/unity-formats", rev = "6f0a1fc6753f4f7fa75aed838c716580afc10de5" }
