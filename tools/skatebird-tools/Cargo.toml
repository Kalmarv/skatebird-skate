[package]
name = "skatebird-tools"
version.workspace = true
license.workspace = true
repository = "https://github.com/Kalmarv/skatebird-skate"
edition = "2024"
publish = false

# The tooling around the conversion: the release packaging (mod folders, icons, zips), the skate. view commands, the
# SkateBIRD reference shots (the lab copy and its BepInEx plugin) and the side-by-side sheets. Not the conversion.
[dependencies]
skatebird-export = { path = "../../program" }
primase-image.workspace = true
serde_json = "=1.0.154"
zip = { version = "2", default-features = false, features = ["deflate"] }

[package.metadata.dist]
# not on crates.io, but each release has its binary
dist = true
